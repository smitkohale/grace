name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installers:
    name: Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS (universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - name: WebKitGTK
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Grace ${{ github.ref_name }}
          releaseBody: |
            Early preview of Grace. Installers aren't signed yet:
            - Windows: if you see "Windows protected your PC", choose More info, then Run anyway.
            - macOS: open System Settings, Privacy & Security, then Open Anyway.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
      - name: Installer size (20 MB budget)
        run: node scripts/check-sizes.mjs installers target
