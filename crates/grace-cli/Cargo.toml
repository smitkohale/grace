[package]
name = "grace-cli"
description = "The grace command: doctor, sessions and serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "grace"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
grace-core = { path = "../grace-core", features = ["server"] }
rust-embed = "8.14.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
