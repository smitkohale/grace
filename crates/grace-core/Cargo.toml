[package]
name = "grace-core"
description = "Grace's engine: events, redaction, adapters, storage and scanning"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", optional = true }
dirs = "7.0.0"
getrandom = { version = "0.4.3", optional = true }
regex = "1.13.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time"], optional = true }
toml_edit = "0.25.21"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[features]
# The local HTTP API, used by `grace serve` and the desktop app.
server = ["dep:axum", "dep:tokio", "dep:getrandom"]
